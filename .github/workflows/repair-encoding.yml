name: repair-repository-encoding

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx tools/repair-encoding.ts
      - run: git config user.name "github-actions[bot]"
      - run: git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - run: git add -A
      - run: git diff --cached --quiet || git commit -m "chore: normalize repository encoding"
      - run: git push
