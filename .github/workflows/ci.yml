name: sale-ia-v2-ci
on:
  push:
    branches: ["main","feature/**"]
  pull_request:
    branches: ["main"]

# CI only needs to read repository contents. Keep the default token least-privileged.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
