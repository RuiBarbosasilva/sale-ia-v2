name: sale-ia-v2-ci
on:
  push:
    branches: ["main","feature/**"]
  pull_request:
    branches: ["main"]

# CI only needs to read repository contents. Keep the default token least-privileged.
permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is currently out of sync with package.json (pdf-lib/jszip).
      # Use npm install temporarily so CI can validate the branch; lockfile regeneration is a follow-up hardening task.
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run typecheck
