<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RB Factory — Máquina Comercial</title><style>body{margin:0;font-family:Inter,Arial;background:#f4f7fb;color:#172033}header{background:#0f172a;color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center}main{max-width:1280px;margin:24px auto;padding:0 18px}.card{background:#fff;border:1px solid #dbe3ee;border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:0 6px 24px #0f172a0d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.kpi{font-size:28px;font-weight:800}.muted{color:#64748b}button{border:0;border-radius:9px;padding:10px 13px;cursor:pointer;font-weight:700;background:#2563eb;color:#fff;margin-right:7px}select,input{padding:10px;border:1px solid #cbd5e1;border-radius:9px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.lead{padding:14px;border:1px solid #e2e8f0;border-radius:10px;margin:8px 0}.score{font-weight:800}.hidden{display:none}textarea{width:100%;box-sizing:border-box;padding:10px}</style></head><body><header><b>⚙ RB Factory — Máquina Comercial</b><a href="/rb-factory" style="color:#fff">← Dashboard</a></header><main><div class="card"><div class="row"><label>Cidade <input id="city" value="Poços de Caldas"></label><label>Segmento <input id="segment" placeholder="ex.: restaurante"></label><button onclick="refresh()">Atualizar</button><button onclick="bootstrap()">Preparar pipeline</button><button onclick="queue()">Fila de abordagem</button></div><p class="muted">A máquina organiza oportunidades, demos, propostas e follow-ups. O envio de mensagens continua sob controle do operador.</p></div><div id="kpis" class="grid"></div><div class="card"><h2>Melhores oportunidades</h2><div id="leads"></div></div><div id="queue" class="card hidden"><h2>Fila de abordagem</h2><div id="queueList"></div></div></main><script>const H=()=>{const h={};const k=sessionStorage.getItem('saleIaAdminKey')||'';if(k)h['x-sale-ia-admin-key']=k;return h};async function req(u,o={}){o.headers={...(o.headers||{}),...H()};let r=await fetch(u,o);if(r.status===401){const k=prompt('Chave administrativa do SALE-IA:');if(!k)throw Error('Acesso não informado');sessionStorage.setItem('saleIaAdminKey',k.trim());o.headers={'x-sale-ia-admin-key':k.trim()};r=await fetch(u,o)}const d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'Erro');return d}function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]))}async function refresh(){const c=encodeURIComponent(document.getElementById('city').value),s=encodeURIComponent(document.getElementById('segment').value);const d=await req('/api/rb-factory-commercial/dashboard?city='+c+'&segment='+s);const x=d.summary;document.getElementById('kpis').innerHTML='<div class="card"><div class="kpi">'+x.prospects+'</div><div class="muted">Prospects</div></div><div class="card"><div class="kpi">'+x.pipelines+'</div><div class="muted">No pipeline</div></div><div class="card"><div class="kpi">'+x.withoutPipeline+'</div><div class="muted">A incluir</div></div><div class="card"><div class="kpi">'+x.dueFollowUps+'</div><div class="muted">Follow-ups vencidos</div></div>';document.getElementById('leads').innerHTML=(d.top||[]).map(p=>'<div class="lead"><b>'+esc(p.companyName)+'</b> <span class="score">score '+esc(p.score)+'</span><br><span class="muted">'+esc(p.segment||'')+' · '+esc(p.city||'')+' · '+esc(p.websiteStatus||'')+' · '+esc(p.phone||'Sem telefone')+'</span><br><button onclick="follow(\''+p.id+'\')">Agendar follow-up</button></div>').join('')||'Nenhum prospect encontrado.'}async function bootstrap(){const r=await req('/api/rb-factory-commercial/bootstrap',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({city:document.getElementById('city').value,segment:document.getElementById('segment').value,limit:50})});alert('Pipeline preparado: '+r.created+' novos, '+r.updated+' atualizados.');refresh()}async function queue(){const c=encodeURIComponent(document.getElementById('city').value),s=encodeURIComponent(document.getElementById('segment').value);const d=await req('/api/rb-factory-commercial/outreach-queue?city='+c+'&segment='+s+'&limit=20');document.getElementById('queue').classList.remove('hidden');document.getElementById('queueList').innerHTML=(d.queue||[]).map(x=>'<div class="lead"><b>'+esc(x.companyName)+'</b><p>'+esc(x.reason)+'</p><textarea rows="4">'+esc(x.suggestedMessage)+'</textarea></div>').join('')||'Fila vazia.'}async function follow(id){const days=prompt('Follow-up em quantos dias?', '3');if(!days)return;await req('/api/rb-factory-commercial/prospects/'+id+'/follow-up',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({days:Number(days)})});alert('Follow-up agendado.');refresh()}refresh().catch(e=>alert(e.message));</script></body></html>
