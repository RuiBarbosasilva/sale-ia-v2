<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALE-IA-V2 | Admin Afiliados</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
body{max-width:1300px;margin:auto;padding:24px}.card{background:#fff;padding:18px;border-radius:16px;margin:12px 0;border:1px solid #e2e7ef;box-shadow:0 4px 18px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{font-size:27px;font-weight:750}.muted{color:#68758a}.row{display:flex;gap:8px;flex-wrap:wrap}input,button,select{padding:10px;border-radius:9px;border:1px solid #ccd5e2;font:inherit}button{cursor:pointer}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid #edf0f4}pre{background:#101827;color:#eaf0fa;padding:12px;border-radius:9px;white-space:pre-wrap}.scroll{overflow:auto}
</style>
</head>
<body>
<h1>Administração de Afiliados</h1>
<div class="card"><div class="row"><input id="key" type="password" placeholder="AFFILIATE_ADMIN_KEY" style="min-width:380px"><button onclick="loadAll()">Carregar painel</button></div><p id="msg" class="muted"></p></div>

<div id="metrics" class="grid"></div>

<div class="card"><h2>Afiliados</h2><div class="scroll" id="affiliates"></div></div>

<div class="card">
<h2>Oferta</h2>
<div class="row"><input id="oname" placeholder="Nome"><input id="onetwork" placeholder="Rede"><input id="oexternal" placeholder="ID externo"><input id="ocategory" placeholder="Categoria"><input id="ourl" placeholder="URL de destino" style="min-width:360px"><input id="orate" type="number" min="0" max="100" value="10" placeholder="%"><button onclick="createOffer()">Criar</button></div>
<div id="offers"></div>
</div>

<div class="card"><h2>Vendas</h2><div class="scroll" id="sales"></div></div>
<div class="card"><h2>Saques</h2><div class="scroll" id="payouts"></div></div>

<script>
let K=localStorage.getItem('affiliateAdminKey')||'';const api=location.origin+'/api/affiliates';key.value=K;
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function call(p,o={}){o.headers={...(o.headers||{}),'x-affiliate-admin-key':K,'Content-Type':'application/json'};const r=await fetch(api+p,o),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}
async function loadAll(){K=key.value;localStorage.setItem('affiliateAdminKey',K);try{const [s,a,o,sa,p]=await Promise.all([call('/admin/stats'),call('/admin'),call('/admin/offers'),call('/admin/sales?take=200'),call('/admin/payouts')]);msg.textContent='Painel atualizado em '+new Date().toLocaleString('pt-BR');renderStats(s.stats);renderAffiliates(a.affiliates);renderOffers(o.offers);renderSales(sa.sales);renderPayouts(p.payouts)}catch(e){msg.textContent=e.message;alert(e.message)}}
function renderStats(s){metrics.innerHTML=Object.entries(s).map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="metric">'+(typeof v==='number'&&/Value|Commission|payout/i.test(k)?brl(v):esc(v))+'</div></div>').join('')}
function renderAffiliates(rows){affiliates.innerHTML='<table><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Links</th><th>Cliques</th><th>Vendas</th><th>Ações</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.status)+'</td><td>'+x._count.links+'</td><td>'+x._count.clicks+'</td><td>'+x._count.sales+'</td><td><button onclick="rotate(\''+x.id+'\')">Novo token</button></td></tr>').join('')+'</table>'}
function renderOffers(rows){offers.innerHTML='<table><tr><th>Oferta</th><th>Rede</th><th>ID externo</th><th>Categoria</th><th>Comissão</th><th>Ativa</th><th>Ação</th></tr>'+rows.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.network||'')+'</td><td>'+esc(x.externalId||'')+'</td><td>'+esc(x.category||'')+'</td><td>'+x.commissionRate+'%</td><td>'+x.active+'</td><td><button onclick="toggleOffer(\''+x.id+'\','+(!x.active)+')">'+(x.active?'Desativar':'Ativar')+'</button></td></tr>').join('')+'</table>'}
function renderSales(rows){sales.innerHTML='<table><tr><th>Data</th><th>Afiliado</th><th>Valor</th><th>Comissão</th><th>Status</th><th>Origem</th><th>Ação</th></tr>'+rows.map(x=>'<tr><td>'+new Date(x.createdAt).toLocaleString('pt-BR')+'</td><td>'+esc(x.affiliate.name)+'</td><td>'+brl(x.amount)+'</td><td>'+brl(x.commissionAmount)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.source)+'</td><td>'+saleButtons(x)+'</td></tr>').join('')+'</table>'}
function saleButtons(x){if(x.status==='PENDING')return '<button onclick="saleStatus(\''+x.id+'\',\'APPROVED\')">Aprovar</button> <button onclick="saleStatus(\''+x.id+'\',\'REJECTED\')">Rejeitar</button>';return ''}
function renderPayouts(rows){payouts.innerHTML='<table><tr><th>Data</th><th>Afiliado</th><th>Valor</th><th>Itens</th><th>Status</th><th>Ação</th></tr>'+rows.map(x=>'<tr><td>'+new Date(x.requestedAt).toLocaleString('pt-BR')+'</td><td>'+esc(x.affiliate.name)+'</td><td>'+brl(x.amount)+'</td><td>'+x.items.length+'</td><td>'+esc(x.status)+'</td><td>'+payoutButtons(x)+'</td></tr>').join('')+'</table>'}
function payoutButtons(x){if(x.status==='REQUESTED')return '<button onclick="payoutStatus(\''+x.id+'\',\'PROCESSING\')">Processar</button> <button onclick="payoutStatus(\''+x.id+'\',\'REJECTED\')">Rejeitar</button>';if(x.status==='PROCESSING')return '<button onclick="payoutStatus(\''+x.id+'\',\'PAID\')">Marcar pago</button> <button onclick="payoutStatus(\''+x.id+'\',\'REJECTED\')">Rejeitar</button>';return ''}
async function createOffer(){try{await call('/admin/offers',{method:'POST',body:JSON.stringify({name:oname.value,network:onetwork.value,externalId:oexternal.value,category:ocategory.value,destinationUrl:ourl.value,commissionRate:Number(orate.value)})});await loadAll()}catch(e){alert(e.message)}}
async function toggleOffer(id,active){try{await call('/admin/offers/'+id,{method:'PATCH',body:JSON.stringify({active})});await loadAll()}catch(e){alert(e.message)}}
async function saleStatus(id,status){try{await call('/admin/sales/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});await loadAll()}catch(e){alert(e.message)}}
async function payoutStatus(id,status){try{const reference=status==='PAID'?prompt('Referência do pagamento (opcional):')||undefined:undefined;await call('/admin/payouts/'+id+'/status',{method:'PATCH',body:JSON.stringify({status,reference})});await loadAll()}catch(e){alert(e.message)}}
async function rotate(id){if(!confirm('Invalidar o token atual e gerar outro?'))return;try{const j=await call('/admin/'+id+'/rotate-token',{method:'POST'});prompt('Novo token. Copie e entregue ao afiliado:',j.accessToken)}catch(e){alert(e.message)}}
if(K)loadAll();
</script>
</body>
</html>
