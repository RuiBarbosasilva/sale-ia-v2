<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALE-IA-V2 | Admin Afiliados</title><style>body{font-family:system-ui;max-width:1200px;margin:auto;padding:24px;background:#f5f7fb;color:#172033}.card{background:white;padding:18px;border-radius:14px;margin:12px 0;border:1px solid #e4e8f0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{font-size:27px;font-weight:700}input,button,select{padding:10px;border-radius:8px;border:1px solid #ccd3df;font:inherit}button{cursor:pointer}.row{display:flex;gap:8px;flex-wrap:wrap}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #eee}pre{background:#101827;color:#eaf0fa;padding:12px;border-radius:9px;white-space:pre-wrap}</style></head><body><h1>Administração de Afiliados</h1><div class="card"><div class="row"><input id="key" type="password" placeholder="AFFILIATE_ADMIN_KEY" style="min-width:340px"><button onclick="load()">Carregar</button></div></div><div id="metrics" class="grid"></div><div class="card"><h2>Afiliados</h2><div id="affiliates"></div></div><div class="card"><h2>Ofertas</h2><div class="row"><input id="oname" placeholder="Nome da oferta"><input id="onetwork" placeholder="Rede"><input id="ourl" placeholder="URL de afiliado" style="min-width:350px"><input id="orate" type="number" value="10" placeholder="%"><button onclick="offer()">Criar oferta</button></div><div id="offers"></div></div><div class="card"><h2>Vendas / Comissões</h2><div id="sales"></div></div><div class="card"><h2>Saques</h2><div id="payouts"></div></div><script>let K='';const api=location.origin+'/api/affiliates';const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0);async function call(p,o={}){o.headers={...(o.headers||{}),'x-affiliate-admin-key':K,'Content-Type':'application/json'};const r=await fetch(api+p,o),j=await r.json();if(!r.ok)throw Error(j.error||'Erro');return j}async function load(){K=key.value;localStorage.setItem('affiliateAdminKey',K);try{const [s,a,o,l,p]=await Promise.all([call('/admin/stats'),call('/admin'),call('/admin/offers'),call('/admin/links'),call('/admin/payouts')]);metrics.innerHTML=Object.entries(s.stats).map(([k,v])=>'<div class="card"><div>'+k+'</div><div class="metric">'+(typeof v==='number'&&/Value|Commission|payout/i.test(k)?brl(v):v)+'</div></div>').join('');affiliates.innerHTML='<table><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Links</th><th>Cliques</th><th>Vendas</th></tr>'+a.affiliates.map(x=>'<tr><td>'+x.name+'</td><td>'+x.email+'</td><td>'+x.status+'</td><td>'+x._count.links+'</td><td>'+x._count.clicks+'</td><td>'+x._count.sales+'</td></tr>').join('')+'</table>';offers.innerHTML=o.offers.map(x=>'<p><b>'+x.name+'</b> · '+(x.network||'')+' · '+x.commissionRate+'% · '+x.destinationUrl+'</p>').join('')||'Nenhuma oferta';sales.innerHTML=l.links.map(x=>'<p><b>'+x.code+'</b> · '+x.affiliate.name+' · '+x.clickCount+' cliques</p>').join('')||'Nenhum link';payouts.innerHTML=p.payouts.map(x=>'<p>'+x.affiliate.name+' · '+brl(x.amount)+' · '+x.status+' <button onclick="pay(\''+x.id+'\')">Marcar pago</button></p>').join('')||'Nenhum saque'}catch(e){alert(e.message)}}async function offer(){try{await call('/admin/offers',{method:'POST',body:JSON.stringify({name:oname.value,network:onetwork.value,destinationUrl:ourl.value,commissionRate:Number(orate.value)})});await load()}catch(e){alert(e.message)}}async function pay(id){try{await call('/admin/payouts/'+id+'/status',{method:'PATCH',body:JSON.stringify({status:'PAID'})});await load()}catch(e){alert(e.message)}}key.value=localStorage.getItem('affiliateAdminKey')||'';</script></body></html>
