<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiliados IA - Painel de Inteligência</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-tertiary: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --success: #10b981;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: var(--bg-primary); color: var(--text-primary); padding: 2rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { margin-bottom: 2rem; border-bottom: 1px solid var(--bg-tertiary); padding-bottom: 1rem; }
    h1 { font-size: 1.8rem; font-weight: 700; color: var(--text-primary); }
    h1 span { color: var(--accent); }
    .subtitle { color: var(--text-secondary); margin-top: 0.5rem; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; margin-top: 2rem; }
    .card { background: var(--bg-secondary); border-radius: 12px; padding: 1.5rem; border: 1px solid var(--bg-tertiary); transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    .card-header { display: flex; justify-content: space-between; align-items: start; margin-bottom: 1rem; }
    .card-title { font-size: 1.1rem; font-weight: 600; color: var(--text-primary); }
    .badge { background: var(--bg-tertiary); color: var(--text-secondary); padding: 0.25rem 0.75rem; border-radius: 999px; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .badge.active { background: rgba(16, 185, 129, 0.2); color: var(--success); }
    
    .stats { display: flex; gap: 1rem; margin-bottom: 1rem; font-size: 0.875rem; color: var(--text-secondary); }
    .stat { display: flex; align-items: center; gap: 0.25rem; }
    
    .btn { width: 100%; padding: 0.75rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s; font-size: 0.9rem; }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { background: var(--bg-tertiary); color: var(--text-secondary); cursor: not-allowed; }
    
    .content-area { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--bg-tertiary); display: none; }
    .content-area.visible { display: block; }
    .content-block { margin-bottom: 1rem; }
    .content-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-secondary); margin-bottom: 0.25rem; display: flex; align-items: center; gap: 0.5rem; }
    .content-text { background: var(--bg-primary); padding: 0.75rem; border-radius: 6px; font-size: 0.85rem; color: var(--text-primary); line-height: 1.5; white-space: pre-wrap; word-break: break-word; border: 1px solid var(--bg-tertiary); }
    
    .loading { display: inline-block; width: 1rem; height: 1rem; border: 2px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite; margin-right: 0.5rem; vertical-align: middle; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--success); color: white; padding: 1rem 1.5rem; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); transform: translateY(150%); transition: transform 0.3s; z-index: 1000; }
    .toast.show { transform: translateY(0); }
    .toast.error { background: #ef4444; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Afiliados <span>IA</span> Intelligence</h1>
      <p class="subtitle">Automação total de conteúdo para Instagram Shop e Redes Sociais</p>
    </header>

    <div id="products-grid" class="grid">
      <!-- Produtos serão injetados aqui via JavaScript -->
      <p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 3rem;">Carregando produtos...</p>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const API_BASE = '/api/afiliados/conteudo';

    async function loadProducts() {
      try {
        // Simulando busca de produtos (em produção, viria de uma rota GET /api/afiliados/produtos)
        // Por enquanto, vamos buscar do banco via uma rota mockada ou usar o produto de teste
        const response = await fetch('/api/afiliados/produtos');
        if (!response.ok) throw new Error('Falha ao carregar produtos');
        const data = await response.json();
        renderProducts(data.products || []);
      } catch (error) {
        console.error('Erro ao carregar produtos:', error);
        document.getElementById('products-grid').innerHTML = 
          '<p style="color: #ef4444; grid-column: 1/-1; text-align: center; padding: 3rem;">Erro ao carregar produtos. Verifique se a API está rodando.</p>';
      }
    }

    function renderProducts(products) {
      const grid = document.getElementById('products-grid');
      if (products.length === 0) {
        grid.innerHTML = '<p style="color: var(--text-secondary); grid-column: 1/-1; text-align: center; padding: 3rem;">Nenhum produto encontrado. Adicione produtos ao sistema.</p>';
        return;
      }

      grid.innerHTML = products.map(product => `
        <div class="card" data-id="${product.id}">
          <div class="card-header">
            <div class="card-title">${product.nome}</div>
            <span class="badge ${product.status === 'ATIVO' ? 'active' : ''}">${product.status}</span>
          </div>
          <div class="stats">
            <div class="stat">💰 R$ ${product.preco.toFixed(2)}</div>
            <div class="stat">📈 ${product.comissaoPercentual}% comissao</div>
            <div class="stat">🎯 Score: ${product.score || 0}</div>
          </div>
          <button class="btn btn-primary" onclick="generateContent('${product.id}', this)">
            ✨ Gerar Conteúdo IA (4K + ElevenLabs)
          </button>
          <div class="content-area" id="content-${product.id}">
            <div class="content-block">
              <div class="content-label">🎬 Prompt de Vídeo 4K</div>
              <div class="content-text" id="prompt-${product.id}">Aguardando geração...</div>
            </div>
            <div class="content-block">
              <div class="content-label">🎙️ Roteiro ElevenLabs</div>
              <div class="content-text" id="script-${product.id}">Aguardando geração...</div>
            </div>
            <div class="content-block">
              <div class="content-label">📱 Legenda Instagram/TikTok</div>
              <div class="content-text" id="caption-${product.id}">Aguardando geração...</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function generateContent(productId, btn) {
      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Gerando com IA...';
      
      const contentArea = document.getElementById(`content-${productId}`);
      contentArea.classList.add('visible');

      try {
        const response = await fetch(`${API_BASE}/gerar-conteudo/${productId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error || 'Erro desconhecido');
        }

        const result = await response.json();
        
        document.getElementById(`prompt-${productId}`).textContent = result.data.videoPrompt;
        document.getElementById(`script-${productId}`).textContent = result.data.elevenLabsScript;
        document.getElementById(`caption-${productId}`).textContent = result.data.instagramCaption;

        showToast('Conteúdo gerado com sucesso! 🚀');
        btn.innerHTML = '✅ Conteúdo Gerado';
        btn.style.background = 'var(--success)';
        
      } catch (error) {
        console.error('Erro ao gerar conteúdo:', error);
        showToast(error.message, true);
        btn.disabled = false;
        btn.innerHTML = '✨ Tentar Novamente';
      }
    }

    function showToast(message, isError = false) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast show' + (isError ? ' error' : '');
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    // Inicializa o dashboard
    loadProducts();
  </script>
</body>
</html>
