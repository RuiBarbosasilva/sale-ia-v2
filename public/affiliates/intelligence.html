<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALE-IA V2 | Afiliados IA</title>
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#172033;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1400px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid #dfe6ef;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 4px 18px #00000008}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.metric{font-size:28px;font-weight:800}.muted{color:#68758a}.row{display:flex;gap:8px;flex-wrap:wrap}input,button,select{padding:10px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{cursor:pointer;background:#172033;color:#fff}button.secondary{background:#fff;color:#172033}.scroll{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}.badge{padding:4px 8px;border-radius:999px;background:#eef2ff}.ok{color:#087443}.warn{color:#9a6700}.err{color:#b42318}pre{white-space:pre-wrap;background:#101827;color:#eaf0fa;padding:12px;border-radius:10px}
</style></head>
<body><main class="wrap">
<div class="top"><div><h1>Afiliados IA</h1><p class="muted">Inteligência de produtos, oportunidades, campanhas e conteúdo.</p></div>
<div class="row"><input id="key" type="password" placeholder="AFFILIATE_ADMIN_KEY" style="min-width:300px"><button onclick="load()">Atualizar</button></div></div>
<div id="msg" class="muted"></div><section id="metrics" class="grid"></section>
<section class="card"><h2>Redes</h2><div class="row"><button onclick="bootstrap()">Inicializar redes padrão</button><span id="networks"></span></div></section>
<section class="card"><h2>Produtos e oportunidades</h2><div class="scroll"><table><thead><tr><th>Produto</th><th>Rede</th><th>Score</th><th>Comissão</th><th>Status</th><th>Ação</th></tr></thead><tbody id="products"></tbody></table></div></section>
<section class="card"><h2>Plano de autonomia</h2><button onclick="plan()">Gerar plano supervisionado</button><pre id="planOut">Nenhum plano gerado.</pre></section>
<section class="card"><h2>Campanha</h2><div class="row"><input id="pid" placeholder="ID do produto" style="min-width:280px"><input id="cname" placeholder="Nome da campanha" style="min-width:280px"><button onclick="campaign()">Criar campanha</button></div><pre id="campaignOut"></pre></section>
</main>
<script>
let K=localStorage.getItem('affiliateAdminKey')||'';key.value=K;const api=location.origin+'/api/affiliate-intelligence';
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
async function call(path,opt={}){opt.headers={...(opt.headers||{}),'x-affiliate-admin-key':K,'Content-Type':'application/json'};const r=await fetch(api+path,opt),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'HTTP '+r.status);return j}
async function load(){K=key.value;localStorage.setItem('affiliateAdminKey',K);try{const [d,p,n,o]=await Promise.all([call('/dashboard'),call('/products?take=100'),call('/networks'),call('/opportunities')]);metrics.innerHTML=Object.entries(d).filter(([k])=>k!=='mode').map(([k,v])=>'<div class="card"><div class="muted">'+esc(k)+'</div><div class="metric">'+esc(v)+'</div></div>').join('');networks.textContent=n.networks.length+' redes cadastradas';products.innerHTML=p.products.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.network?.name||'')+'</td><td><b>'+Number(x.opportunityScore||0).toFixed(1)+'</b></td><td>'+esc(x.commissionRate||0)+'%</td><td><span class="badge">'+esc(x.status)+'</span></td><td><button onclick="campaignFor(\''+x.id+'\')">Campanha</button></td></tr>').join('')||'<tr><td colspan="6">Nenhum produto. Inicialize uma rede e importe produtos.</td></tr>';msg.textContent='Atualizado em '+new Date().toLocaleString('pt-BR')+' · '+o.opportunities.length+' oportunidades';}catch(e){msg.textContent=e.message;msg.className='err'}}
async function bootstrap(){try{await call('/bootstrap',{method:'POST'});await load()}catch(e){alert(e.message)}}
async function plan(){try{const j=await call('/autonomy-plan');planOut.textContent=JSON.stringify(j.plan,null,2)}catch(e){planOut.textContent=e.message}}
function campaignFor(id){pid.value=id;cname.value=''}
async function campaign(){try{const j=await call('/campaigns',{method:'POST',body:JSON.stringify({productId:pid.value,name:cname.value||undefined})});campaignOut.textContent=JSON.stringify(j.campaign,null,2)}catch(e){campaignOut.textContent=e.message}}
if(K)load();
</script></body></html>
