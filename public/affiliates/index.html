<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALE-IA-V2 | Central de Afiliados</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#172033;background:#f5f7fb}
body{max-width:1180px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e2e7ef;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #00000008}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.metric{font-size:28px;font-weight:750}.muted{color:#68758a}.row{display:flex;gap:10px;flex-wrap:wrap}input,button,select{padding:11px;border:1px solid #cbd4e1;border-radius:10px;font:inherit}button{cursor:pointer}.danger{background:#fff1f1}.success{color:#087443}.hidden{display:none}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid #edf0f4}code{word-break:break-all}
</style>
</head>
<body>
<h1>Central de Afiliados</h1>
<p class="muted">Links rastreáveis, vendas, comissões e saques.</p>

<section class="card">
<h2>Cadastro</h2>
<div class="row"><input id="name" placeholder="Nome"><input id="email" type="email" placeholder="E-mail"><input id="phone" placeholder="Telefone"><button onclick="register()">Cadastrar</button></div>
<pre id="registerOut" class="hidden"></pre>
</section>

<section class="card">
<h2>Acesso</h2>
<div class="row"><input id="token" placeholder="Token de acesso" style="min-width:360px"><button onclick="login()">Entrar</button><button onclick="logout()">Sair</button></div>
<p id="status" class="muted"></p>
</section>

<div id="portal" class="hidden">
<div class="grid">
<div class="card"><div class="muted">Cliques</div><div id="clicks" class="metric">0</div></div>
<div class="card"><div class="muted">Vendas</div><div id="sales" class="metric">0</div></div>
<div class="card"><div class="muted">Comissões</div><div id="commissions" class="metric">R$ 0,00</div></div>
<div class="card"><div class="muted">Saldo aprovado</div><div id="balance" class="metric">R$ 0,00</div></div>
<div class="card"><div class="muted">Em saque</div><div id="inProgress" class="metric">R$ 0,00</div></div>
</div>

<div class="card">
<h2>Solicitar saque</h2>
<div class="row"><select id="method"><option value="PIX">PIX</option><option value="TRANSFERENCIA">Transferência</option></select><button onclick="requestPayout()">Solicitar saque do saldo aprovado</button></div>
</div>

<div class="card">
<h2>Meus links</h2>
<div class="row"><input id="campaign" placeholder="Campanha"><input id="destinationUrl" placeholder="URL de destino" style="min-width:360px"><button onclick="createLink()">Criar link</button></div>
<div id="links"></div>
</div>

<div class="card"><h2>Vendas recentes</h2><div id="recentSales"></div></div>
<div class="card"><h2>Saques recentes</h2><div id="recentPayouts"></div></div>
</div>

<script>
const api=location.origin+'/api/affiliates';
let token=localStorage.getItem('affiliateToken')||'';
const brl=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function call(path,opt={}){opt.headers={...(opt.headers||{}),'Content-Type':'application/json'};if(token)opt.headers.Authorization='Bearer '+token;const r=await fetch(api+path,opt);const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||'Erro');return j}
async function register(){try{const j=await call('/register',{method:'POST',body:JSON.stringify({name:name.value,email:email.value,phone:phone.value})});registerOut.classList.remove('hidden');registerOut.textContent='TOKEN: '+j.accessToken;token=j.accessToken;localStorage.setItem('affiliateToken',token);await login()}catch(e){alert(e.message)}}
async function login(){try{const j=await call('/portal');portal.classList.remove('hidden');token.value=token;status.textContent='Conectado como '+j.affiliate.name;clicks.textContent=j.metrics.clicks;sales.textContent=j.metrics.sales;commissions.textContent=brl(j.metrics.commissions);balance.textContent=brl(j.metrics.approvedBalance);inProgress.textContent=brl(j.metrics.payoutInProgress);renderSales(j.recentSales||[]);renderPayouts(j.recentPayouts||[]);await loadLinks()}catch(e){status.textContent=e.message;portal.classList.add('hidden')}}
async function loadLinks(){const j=await call('/portal/links');links.innerHTML=j.links.map(x=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+esc(x.code)+'</b><br><code>'+esc(location.origin+'/go/'+x.code)+'</code><br><span class="muted">'+x.clickCount+' cliques · '+(x.active?'ativo':'inativo')+'</span></div>').join('')||'<p>Nenhum link.</p>'}
function renderSales(rows){recentSales.innerHTML=rows.map(x=>'<p>'+new Date(x.createdAt).toLocaleString('pt-BR')+' · '+brl(x.amount)+' · comissão '+brl(x.commissionAmount)+' · <b>'+esc(x.status)+'</b></p>').join('')||'<p>Nenhuma venda.</p>'}
function renderPayouts(rows){recentPayouts.innerHTML=rows.map(x=>'<p>'+new Date(x.requestedAt).toLocaleString('pt-BR')+' · '+brl(x.amount)+' · <b>'+esc(x.status)+'</b></p>').join('')||'<p>Nenhum saque.</p>'}
async function createLink(){try{const body={campaign:campaign.value};if(destinationUrl.value.trim())body.destinationUrl=destinationUrl.value.trim();const j=await call('/portal/links',{method:'POST',body:JSON.stringify(body)});alert('Link criado: '+location.origin+'/go/'+j.link.code);campaign.value='';destinationUrl.value='';await login()}catch(e){alert(e.message)}}
async function requestPayout(){try{const j=await call('/portal/payouts',{method:'POST',body:JSON.stringify({method:method.value})});alert('Saque solicitado: '+brl(j.payout.amount));await login()}catch(e){alert(e.message)}}
function logout(){token='';localStorage.removeItem('affiliateToken');portal.classList.add('hidden');status.textContent='Desconectado'}
if(token)login();
</script>
</body>
</html>
