<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RB Factory Sites — Biblioteca de Demos</title><style>body{font-family:Arial;margin:0;background:#f6f7f9;color:#111}header{padding:50px 7vw;background:#111;color:#fff}main{padding:40px 7vw}.niche{background:#fff;padding:24px;margin:18px 0;border-radius:18px}.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.links a{padding:14px;border:1px solid #ddd;border-radius:12px;text-decoration:none;color:#111}small{color:#666}</style></head><body><header><h1>RB Factory Sites</h1><p>Biblioteca de 100 demos originais para apresentação e como referência de criação.</p></header><main id="app"></main><script>
fetch('/api/rb-factory-benchmark/catalog').then(r=>r.json()).then(d=>{document.querySelector('#app').innerHTML=d.niches.map(n=>'<section class="niche"><h2>'+n.name+'</h2><small>'+n.description+' · '+n.count+' modelos</small><div class="links">'+Array.from({length:n.count},(_,i)=>'<a target="_blank" href="/api/rb-factory-benchmark/demos/'+n.slug+'/'+(i+1)+'">Modelo '+String(i+1).padStart(2,'0')+'</a>').join('')+'</div></section>').join('')})
</script></body></html>
