<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SALE-IA-V2 · Vendedor Sênior</title><style>body{font-family:Arial,sans-serif;max-width:1100px;margin:30px auto;padding:0 18px}h1{margin-bottom:4px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{border:1px solid #ddd;border-radius:12px;padding:16px}.chat{border:1px solid #ddd;border-radius:12px;padding:16px;margin-top:18px}.msg{padding:10px;margin:8px 0;border-radius:8px;background:#f5f5f5}textarea{width:100%;min-height:90px}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer;margin-top:8px}</style></head><body><h1>Vendedor Sênior IA</h1><p>Qualificação, objeções, follow-up e fechamento com aprovação humana para ações externas.</p><div id="dash" class="grid"></div><div class="chat"><button onclick="newChat()">Nova conversa</button><div id="conversation"></div><textarea id="message" placeholder="Mensagem do cliente..."></textarea><button onclick="send()">Analisar e gerar resposta</button></div><script>let cid=null;async function api(u,o){const r=await fetch(u,o);return r.json()}async function load(){const d=await api('/api/sales/dashboard');document.getElementById('dash').innerHTML=Object.entries(d).map(([k,v])=>'<div class="card"><b>'+k+'</b><div>'+v+'</div></div>').join('')}async function newChat(){const c=await api('/api/sales/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:'WEB'})});cid=c.id;render(c)}async function render(c){document.getElementById('conversation').innerHTML='<p><b>Status:</b> '+c.stage+' · '+c.temperature+'</p>'+(c.messages||[]).map(m=>'<div class="msg"><b>'+m.role+'</b>: '+m.content+'</div>').join('')}async function send(){if(!cid)await newChat();const m=document.getElementById('message').value;const r=await api('/api/sales/conversations/'+cid+'/respond',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m})});document.getElementById('message').value='';const c=await api('/api/sales/conversations/'+cid);render(c);alert('Próxima ação: '+r.nextBestAction+' | Resposta gerada pronta para aprovação.')}load()</script></body></html>
